name: StreamBox Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: npx vite build

      # 🚨 NEW SMART FIX STEP 🚨
      # This automatically finds index.html wherever Lovable hid it 
      # and moves the folder to 'dist' for Capacitor!
      - name: Auto-fix dist folder for Capacitor
        run: |
          INDEX_PATH=$(find . -path ./node_modules -prune -o -name "index.html" -print | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "Build failed: index.html not found anywhere!"
            exit 1
          fi
          DIST_DIR=$(dirname "$INDEX_PATH")
          echo "Found index.html in $DIST_DIR"
          if [ "$DIST_DIR" != "./dist" ]; then
            echo "Moving $DIST_DIR to ./dist so Capacitor can find it..."
            rm -rf ./dist
            mv "$DIST_DIR" ./dist
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBox-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
